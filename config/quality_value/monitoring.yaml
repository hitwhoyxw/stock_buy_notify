# 监控与状态机（§9 / §10）。强提醒条件全部可配置。
strong_strike_requires:
  - pool_qualified
  - zone_strike
  - not_valuation_uncertain
  - not_unreviewed_red_flag
  - not_blocking_cycle_high
  - not_data_insufficient
optimistic_alert_holdings_only: true
dedupe_trading_days: 5
# 周期高位只阻断自动强提醒，不把 zone 从击球改成关注（v1.1）。
cycle_high_blocks_strong_alert: true
cycle_high_downgrades_zone: false
data_coverage:
  normal: 0.90
  display_gap: 0.80
  watch: 0.70
  # <70% 不参与正式排名（观察池 + data_insufficient）
