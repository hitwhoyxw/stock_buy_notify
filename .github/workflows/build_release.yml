name: Build Desktop Release

on:
  schedule:
    # 19:30 CST (UTC+8) = 11:30 UTC，每天一次
    - cron: "30 11 * * *"
  workflow_dispatch:

# C#（Avalonia / .NET 10）桌面端每日构建，替代原 PyInstaller/PyQt 版。
# 目前只打 Windows x64（linux/macOS 未验证，需要时用 desktop/build.bat 或 src/build.ps1 本地出包）。
# 移动端（Android/iOS）走 build_mobile.yml。
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需完整历史才能查 tag

      # 仅当 HEAD 没有被 tag 过（即有新提交）才构建，
      # 避免每天重复发版。manual dispatch 时也会检查。
      - name: Check if HEAD is already released
        id: check
        shell: bash
        run: |
          if [ -n "$(git tag --points-at HEAD)" ]; then
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "::notice::HEAD 已有 release tag，跳过构建"
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "::notice::HEAD 无 release tag，将构建新版本"
          fi

      - name: Skip (no updates)
        if: steps.check.outputs.should_build != 'true'
        run: echo "No new commits since last release. Skipping."

      - name: Setup .NET
        if: steps.check.outputs.should_build == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      # 版本号 = vYYYY.MM.DD；同一天多次触发则追加短 SHA
      - name: Compute version
        if: steps.check.outputs.should_build == 'true'
        id: version
        shell: bash
        run: |
          VERSION="v$(date +%Y.%m.%d)"
          if git tag -l "$VERSION" | grep -q .; then
            SHA=$(git rev-parse --short HEAD)
            VERSION="$VERSION-$SHA"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # 与 desktop/windows/build.bat 相同的发布参数：
      # self-contained 单文件（内嵌 .NET 10 运行时，目标机无需安装）
      - name: Publish win-x64 (self-contained)
        if: steps.check.outputs.should_build == 'true'
        run: >
          dotnet publish src/ThreeBucket.UI/ThreeBucket.UI.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Zip artifact
        if: steps.check.outputs.should_build == 'true'
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zipPath = "dist/ThreeBucket-win-x64-$v.zip"
          Compress-Archive -Path "src/ThreeBucket.UI/bin/Release/net10.0/win-x64/publish/*" -DestinationPath $zipPath -Force
          $sizeMB = [math]::Round((Get-Item $zipPath).Length / 1MB, 1)
          Write-Host "Created: $zipPath ($sizeMB MB)"

      - name: Create Release
        if: steps.check.outputs.should_build == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DATE_STR=$(date '+%Y-%m-%d %H:%M')
          SHA_SHORT=${GITHUB_SHA:0:7}

          printf '## 自动构建（C# / Avalonia）\n\n构建时间: %s\n提交: %s\n\n### 下载\n- 下载 `ThreeBucket-win-x64-%s.zip` 解压后运行 `ThreeBucket.UI.exe`\n- self-contained 自包含构建，无需安装 .NET 运行时\n- 需 Windows 10/11 x64\n' "$DATE_STR" "$SHA_SHORT" "$VERSION" > /tmp/release_notes.md

          gh release create "$VERSION" \
            "dist/ThreeBucket-win-x64-$VERSION.zip" \
            --title "三桶策略系统 $VERSION" \
            --notes-file /tmp/release_notes.md
