name: T2 weekly dividend + T6 pool

on:
  schedule:
    - cron: "30 0 * * 1"
    - cron: "0 12 * * 5"
  workflow_dispatch:
    inputs:
      task:
        description: "t2 / t6 / both"
        default: "both"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - uses: actions/cache@v4
        with:
          path: data/cache
          key: data-cache-${{ github.run_id }}
          restore-keys: data-cache-

      - name: T2 weekly dividend
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          WECOM_BOT_KEY: ${{ secrets.WECOM_BOT_KEY }}
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: python scripts/t2_weekly_dividend.py

      - name: T6 candidate pool
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: python scripts/t6_candidate_pool.py

      - name: commit results
        run: |
          git config user.name "trading-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/live_signal_log.csv data/report_*.md data/skill_input_T6.md data/candidates_*.csv || true
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore(weekly): $(date +%F) run"
          git push
