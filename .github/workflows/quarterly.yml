name: T5 quarterly attribution + T7-AB

on:
  # 定时已由 C# 版 cs-quarterly.yml（T5）+ cs-monthly.yml（T7）接管。
  # 保留 workflow_dispatch 作 Python 应急回退；确认 C# 版稳定后可整文件删除。
  # schedule:
  #   - cron: "0 13 28 3,6,9,12 *"
  #   - cron: "0 12 28 3,6,9,12 *"
  workflow_dispatch:
    inputs:
      task:
        description: "t5 / t7ab"
        default: "t7ab"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - uses: actions/cache@v4
        with:
          path: data/cache
          key: data-cache-${{ github.run_id }}
          restore-keys: data-cache-

      - name: T7-AB quarterly backtest
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: python scripts/t7_backtest.py --bucket AB

      - name: T5 attribution prepare
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: python scripts/t5_prepare.py

      - name: commit results
        run: |
          git config user.name "trading-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/report_*.md data/skill_input_T5.md trading-system/06_backtest_*_result.csv || true
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore(quarterly): $(date +%F) T5-prepare + T7-AB"
          git push
