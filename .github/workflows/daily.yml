name: T1 每日风控 + T8 台账维护

on:
  schedule:
    # UTC 08:30 ≈ 北京时间 16:30，交易日盘后
    - cron: "30 8 * * 1-5"
    # UTC 09:00 ≈ 17:00 跑 T8 回补
    - cron: "0 9 * * 1-5"
  workflow_dispatch:
    inputs:
      task:
        description: "手动指定任务：t1 / t8 / both"
        default: "both"
        required: false

concurrency:
  group: daily-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_WRITE_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: 交易日校验
        id: trading_day
        run: python scripts/lib/trading_day.py
        continue-on-error: true

      - name: 跳过非交易日
        if: steps.trading_day.outputs.is_trading_day != 'true'
        run: |
          echo "非交易日或节假日，跳过后续步骤"
          exit 0

      - name: 运行 T1 · 每日风控
        if: |
          steps.trading_day.outputs.is_trading_day == 'true' &&
          (github.event.schedule == '30 8 * * 1-5' ||
           github.event.inputs.task == 't1' ||
           github.event.inputs.task == 'both')
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          WECOM_BOT_KEY: ${{ secrets.WECOM_BOT_KEY }}
          LARK_WEBHOOK:  ${{ secrets.LARK_WEBHOOK }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO:   ${{ secrets.SMTP_TO }}
        run: python scripts/t1_daily_risk.py

      - name: 运行 T8 · 台账维护
        if: |
          steps.trading_day.outputs.is_trading_day == 'true' &&
          (github.event.schedule == '0 9 * * 1-5' ||
           github.event.inputs.task == 't8' ||
           github.event.inputs.task == 'both')
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          WECOM_BOT_KEY: ${{ secrets.WECOM_BOT_KEY }}
          LARK_WEBHOOK:  ${{ secrets.LARK_WEBHOOK }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO:   ${{ secrets.SMTP_TO }}
        run: python scripts/t8_signal_log.py

      - name: 回写产物
        if: steps.trading_day.outputs.is_trading_day == 'true'
        run: |
          git config user.name  "trading-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/live_signal_log.csv data/report_*.md || true
          git diff --cached --quiet && echo "无变更" && exit 0
          git commit -m "chore(daily): $(date +%F) T1/T8 run"
          git push
