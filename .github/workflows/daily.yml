name: T1 daily risk + T8 signal log

on:
  schedule:
    - cron: "30 8 * * 1-5"
    - cron: "0 9 * * 1-5"
  workflow_dispatch:
    inputs:
      task:
        description: "t1 / t8 / both"
        default: "both"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      # 缓存 data/cache（交易日历 + 行情 parquet）。该目录被 .gitignore 忽略，
      # 不加 cache 时 CI 每次空仓、trading_day 首跑必依赖 akshare 拉新浪接口，
      # 海外 runner 易超时/限流 → is_trading_day 输出为空 → T1/T8 静默跳过。
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: data-cache-${{ github.run_id }}
          restore-keys: data-cache-

      - name: check trading day
        id: td
        run: python scripts/lib/trading_day.py
        continue-on-error: true

      - name: T1 daily risk
        if: steps.td.outputs.is_trading_day == 'true'
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          WECOM_BOT_KEY: ${{ secrets.WECOM_BOT_KEY }}
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: python scripts/t1_daily_risk.py

      - name: T8 signal log
        if: steps.td.outputs.is_trading_day == 'true'
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          WECOM_BOT_KEY: ${{ secrets.WECOM_BOT_KEY }}
          LARK_WEBHOOK: ${{ secrets.LARK_WEBHOOK }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: python scripts/t8_signal_log.py

      - name: commit results
        if: steps.td.outputs.is_trading_day == 'true'
        run: |
          git config user.name "trading-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/live_signal_log.csv data/report_*.md || true
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore(daily): $(date +%F) T1/T8 run"
          git push
